name: Movie Service CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: sandeep07k/movie-service

jobs:

  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Maven tests
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: ./mvnw clean test


  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build application
        run: ./mvnw package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            sandeep07k/movie-service:latest
            sandeep07k/movie-service:${{ github.sha }}

      - name: Trigger infrastructure deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          repository: sandeep07k/showtime-infrastructure
          event-type: deploy-movie-service
          client-payload: '{"image_tag":"${{ github.sha }}"}'
